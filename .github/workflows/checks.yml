name: Validate mod package
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - run: python -m unittest -v
      - name: Verify installation from this repository in published Solar Sim
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v1.7.0 --repo gtts-ux/solar-sim --pattern solar-sim.zip --dir "$RUNNER_TEMP/proxima-app"
          python tools/smoke_install.py "$RUNNER_TEMP/proxima-app/solar-sim.zip"
